name: Install updated social preview card

on:
  push:
    paths:
      - 'tmp/og-card/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode card, archive v1, and update metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/archive

          if [ -f assets/elisey-og.jpg ] && [ ! -f assets/archive/elisey-og-v1.jpg ]; then
            cp assets/elisey-og.jpg assets/archive/elisey-og-v1.jpg
          fi

          cat tmp/og-card/part-*.b64 | tr -d '\n\r ' | base64 --decode > assets/elisey-og-fall-2026.jpg
          test -s assets/elisey-og-fall-2026.jpg
          rm -f assets/elisey-og.jpg

          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new_url = 'https://eliseykyunttsel.com/assets/elisey-og-fall-2026.jpg?v=20260910'
          old_url = 'https://eliseykyunttsel.com/assets/profile-photo.PNG'
          s = s.replace(f'<meta property="og:image" content="{old_url}" />', f'<meta property="og:image" content="{new_url}" />')
          s = s.replace(f'<meta name="twitter:image" content="{old_url}" />', f'<meta name="twitter:image" content="{new_url}" />')

          old_alt = 'Elisey Kyunttsel, Class of 2027 student-athlete and Row New York rower.'
          new_alt = 'Elisey Kyunttsel rowing recruiting profile showing 2K progression toward a sub-6:30 goal, 5K erg benchmark, GPA, and SAT preparation benchmark.'
          s = s.replace(f'<meta property="og:image:alt" content="{old_alt}" />', f'<meta property="og:image:alt" content="{new_alt}" />')
          s = s.replace(f'<meta name="twitter:image:alt" content="{old_alt}" />', f'<meta name="twitter:image:alt" content="{new_alt}" />')

          marker = f'<meta property="og:image" content="{new_url}" />'
          extra = '\n'.join([
              f'<meta property="og:image" content="{new_url}" />',
              '  <meta property="og:image:secure_url" content="https://eliseykyunttsel.com/assets/elisey-og-fall-2026.jpg?v=20260910" />',
              '  <meta property="og:image:type" content="image/jpeg" />',
              '  <meta property="og:image:width" content="1200" />',
              '  <meta property="og:image:height" content="630" />',
          ])
          if 'property="og:image:width"' not in s:
              s = s.replace(marker, extra)

          p.write_text(s, encoding='utf-8')
          PY

          rm -rf tmp/og-card

      - name: Commit installed card
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install fall 2026 social preview card"
          git push
